name: Daily Embeddings to Quadrant

on:
  schedule:
    - cron: "0 3 * * *"   # täglich 03:00 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
      - name: Debug requirements + commit
        run: |
              echo "COMMIT:"
              git rev-parse HEAD
              echo "DATE:"
              git show -s --format=%ci HEAD
              echo "REQUIREMENTS:"
              sed -n '1,200p' requirements.txt
    
      - name: Run daily embeddings
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          QADRANT_ENDPOINT: ${{ secrets.QADRANT_ENDPOINT }}
          QADRANT_API_KEY: ${{ secrets.QADRANT_API_KEY }}
          PYTHONPATH: .
        run: |
          python flows/embeddings.py
